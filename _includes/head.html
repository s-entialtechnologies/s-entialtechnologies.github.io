<head>
  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <!-- Meta Description with Fallback -->
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">


  <!-- Canonical URL -->
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <!-- Favicons -->
  <link href="{{ "/assets/img/logo/favicon.png" | prepend: site.baseurl }}" rel="icon"> 
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/logo/favicon.png"> 

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ "/assets/css/styles.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">

  {% seo title=false %}
</head>
